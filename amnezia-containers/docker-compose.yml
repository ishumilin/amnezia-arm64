version: '3.8'

services:
  amnezia-awg:
    image: ishumilin/amnezia-awg:latest
    container_name: amnezia-awg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    volumes:
      - /lib/modules:/lib/modules
      - ./configs/awg:/opt/amnezia/awg
    ports:
      - "33911:33911/udp"
    restart: unless-stopped
    networks:
      - amnezia

networks:
  amnezia:
    driver: bridge
